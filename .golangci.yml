# golangci-lint v2 configuration  --  https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, unnamedResult]
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: false
    gosec:
      excludes: [G404] # math/rand is fine outside crypto
  exclusions:
    generated: lax
    paths:
      - gen/ # protoc output
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, errcheck]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/crowbett/ratelimitd]
    gofumpt:
      extra:
        group-params: true
  exclusions:
    paths:
      - gen/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
