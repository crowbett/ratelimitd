syntax = "proto3";

package echo.v1;

option go_package = "github.com/crowbett/ratelimitd/gen/echo/v1;echov1";

// EchoService is a minimal service with one unary and one server-streaming RPC.
service EchoService {
  // Echo returns the request message unchanged.
  rpc Echo(EchoRequest) returns (EchoResponse) {}
  // EchoStream returns the request message `count` times, one per stream message.
  rpc EchoStream(EchoStreamRequest) returns (stream EchoStreamResponse) {}
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  // request_id is the server-assigned or client-provided (x-request-id metadata) id.
  string request_id = 2;
}

message EchoStreamRequest {
  string message = 1;
  // count is the number of messages to stream back; 0 means 1.
  int32 count = 2;
}

message EchoStreamResponse {
  string message = 1;
  // seq is the 1-based sequence number of this message within the stream.
  int32 seq = 2;
}
