# https://taskfile.dev  --  install: go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

vars:
  APP: ratelimitd
  MAIN: ./cmd/ratelimitd
  BIN: bin/{{.APP}}{{exeExt}}
  CTL: bin/ratelimitctl{{exeExt}}
  IMAGE: '{{.APP}}:local'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  GRPC_ADDR: '{{.GRPC_ADDR | default "localhost:50053"}}'
  REDIS_ADDR: '{{.REDIS_ADDR | default "127.0.0.1:6380"}}'

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list

  gen:
    desc: Regenerate gen/ from proto/ with buf (local protoc-gen-go + protoc-gen-go-grpc)
    cmds:
      - buf generate
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - gen/**/*.pb.go

  tidy:
    desc: go mod tidy + verify
    cmds:
      - go mod tidy
      - go mod verify

  build:
    desc: Build ratelimitd and ratelimitctl into bin/
    deps: [gen]
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}} {{.MAIN}}
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.CTL}} ./cmd/ratelimitctl
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"
      - "{{.CTL}}"

  run:
    desc: "Run ratelimitd locally (gRPC :50053, HTTP :8093, admin 127.0.0.1:9130; redis must be up: task redis:up)"
    deps: [gen]
    cmds:
      - go run -ldflags="-X main.version={{.VERSION}}" {{.MAIN}}
    env:
      LOG_FORMAT: text
      REDIS_ADDR: "{{.REDIS_ADDR}}"
      POLICY_FILE: '{{.POLICY_FILE | default "policies.example.yaml"}}'

  client:
    desc: "Run ratelimitctl against a running ratelimitd (task client -- health | check ... | policy ... | reset ... )"
    cmds:
      - go run ./cmd/ratelimitctl -addr {{.GRPC_ADDR}} {{.CLI_ARGS}}

  bench:
    desc: "Load test a running ratelimitd at the plan's target (task bench -- -rps 60000 -keys 10000 -duration 30s -rate 100000 -burst 10000)"
    cmds:
      - go run ./cmd/ratelimitctl -addr {{.GRPC_ADDR}} bench -tenant bench -rps 60000 -keys 10000 -duration 30s {{.CLI_ARGS}}

  bench:matrix:
    desc: "The README bench matrix against a running daemon: grpc/http x 10k keys/1 key (scripts/bench.ps1 -> results/bench/<ts>.md)"
    cmds:
      - pwsh -NoProfile -File scripts/bench.ps1 {{.CLI_ARGS}}

  redis:up:
    desc: Start redis (6380) and wait for health
    cmds:
      - docker compose up -d --wait

  redis:down:
    desc: Stop the compose stack (keeps the volume)
    cmds:
      - docker compose down

  test:integration:
    desc: "Tests that need the compose stack (-tags integration, TEST_REDIS_ADDR)"
    deps: [redis:up]
    cmds:
      - go test -race -count=1 -tags integration ./...
    env:
      CGO_ENABLED: "1"
      TEST_REDIS_ADDR: "{{.REDIS_ADDR}}"

  test:
    desc: Run tests with the race detector (needs a C compiler on Windows)
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: "1"

  test:fast:
    desc: Run tests without -race
    cmds:
      - go test -count=1 ./...

  bench:micro:
    desc: "Go benchmarks for the algorithms and the local store (target: < 100 ns/op, 0 allocs per Step)"
    cmds:
      - go test -run '^$' -bench . -benchmem ./internal/algo/... ./internal/store/local/...

  cover:
    desc: Coverage report (opens HTML)
    cmds:
      - go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: buf lint + golangci-lint
    cmds:
      - buf lint
      - golangci-lint run ./...

  lint:breaking:
    desc: buf breaking check against the main branch
    cmds:
      - buf breaking --against ".git#branch=main"

  fmt:
    desc: Format protos (buf) and Go (gofumpt + goimports)
    cmds:
      - buf format -w
      - golangci-lint fmt ./...

  vuln:
    desc: govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  check:
    desc: tidy + vet + lint + test
    deps: [tidy]
    cmds:
      - task: vet
      - task: lint
      - task: test:fast

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}} --build-arg VERSION={{.VERSION}} .

  docker:run:
    desc: "Run the container on :50053/:8093 (REDIS_ADDR must point at a reachable redis)"
    cmds:
      - docker run --rm -p 50053:50053 -p 8093:8093 -e LOG_FORMAT=text -e REDIS_ADDR="{{.REDIS_ADDR}}" {{.IMAGE}}

  clean:
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force bin, coverage.out, coverage.html -ErrorAction SilentlyContinue"{{else}}rm -rf bin coverage.out coverage.html{{end}}'
